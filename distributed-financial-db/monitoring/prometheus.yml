global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'cockroachdb'
    metrics_path: /_status/vars
    static_configs:
      - targets: ['cockroachdb-node1:8080', 'cockroachdb-node2:8080', 'cockroachdb-node3:8080']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'kafka-jmx'
    static_configs:
      - targets: ['kafka:7071']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'ingestion-worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['ingestion-worker:8000']

  - job_name: 'consumers'
    metrics_path: /metrics
    static_configs:
      - targets: ['trades-consumer:8091', 'book-consumer:8092']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
