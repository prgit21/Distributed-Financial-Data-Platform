services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [finnet]

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9999:9999"   # JMX port
      - "7071:7071"   # Prometheus metrics exposed by JMX agent
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 3

      # --- JMX ---
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka

      # --- JMX PROMETHEUS AGENT ---
      KAFKA_OPTS: "-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7071:/opt/jmx/kafka-jmx.yml"
    volumes:
      - ./monitoring/jmx-exporter/kafka-jmx.yml:/opt/jmx/kafka-jmx.yml:ro
      - ./monitoring/jmx-exporter/jmx_prometheus_javaagent.jar:/opt/jmx/jmx_prometheus_javaagent.jar:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [finnet]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_SERVER: kafka:9092
    ports:
      - "9308:9308"
    networks: [finnet]

  cockroachdb-node1:
    image: cockroachdb/cockroach:v23.2.5
    command: start --insecure --advertise-addr=cockroachdb-node1 --join=cockroachdb-node1,cockroachdb-node2,cockroachdb-node3
    hostname: cockroachdb-node1
    volumes:
      - cockroach-node1:/cockroach/cockroach-data
    ports:
      - "26257:26257"
      - "8080:8080"
    networks: [finnet]

  cockroachdb-node2:
    image: cockroachdb/cockroach:v23.2.5
    command: start --insecure --advertise-addr=cockroachdb-node2 --join=cockroachdb-node1,cockroachdb-node2,cockroachdb-node3
    hostname: cockroachdb-node2
    volumes:
      - cockroach-node2:/cockroach/cockroach-data
    networks: [finnet]

  cockroachdb-node3:
    image: cockroachdb/cockroach:v23.2.5
    command: start --insecure --advertise-addr=cockroachdb-node3 --join=cockroachdb-node1,cockroachdb-node2,cockroachdb-node3
    hostname: cockroachdb-node3
    volumes:
      - cockroach-node3:/cockroach/cockroach-data
    networks: [finnet]

  cockroach-init:
    image: cockroachdb/cockroach:v23.2.5
    depends_on:
      - cockroachdb-node1
      - cockroachdb-node2
      - cockroachdb-node3
    command: init --insecure --host=cockroachdb-node1
    networks: [finnet]

  # Apply Cockroach schema from db/schema_cockroach.sql
  # Apply Cockroach schema from db/schema_cockroach.sql
  # Apply Cockroach schema from db/schema_cockroach.sql
  # Apply Cockroach schema from db/schema_cockroach.sql
  cockroach-schema:
    image: cockroachdb/cockroach:v23.2.5
    depends_on:
      cockroach-init:
        condition: service_completed_successfully
    volumes:
      - ./db/schema_cockroach.sql:/schema.sql:ro
      # Mount the new script file
      - ./db/init_cockroach.sh:/init_cockroach.sh:ro
    # Override entrypoint to run our script directly
    entrypoint: ["/bin/bash", "/init_cockroach.sh"]
    networks: [finnet]

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/postgres_schema.sql:/docker-entrypoint-initdb.d/postgres_schema.sql:ro
    networks: [finnet]

  prometheus:
    image: prom/prometheus:v2.49.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-rules:/etc/prometheus/rules:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks: [finnet]

  grafana:
    image: grafana/grafana-oss:10.3.3
    depends_on:
      - prometheus
      - postgres
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      # Map the YAML configs
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # Map the JSON dashboard files
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [finnet]

  ingestion-worker:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - ./ingestion/.env
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER:-kafka:9092}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks: [finnet]

  trades-consumer:
    build:
      context: ./consumers
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      cockroach-schema:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER:-kafka:9092}
      KAFKA_TOPIC: market.trades.raw
      KAFKA_GROUP: trades-cockroach-consumer
      COCKROACH_DSN: postgresql://root@cockroachdb-node1:26257/market?sslmode=disable
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/market
      ENABLE_DUAL_WRITE: ${ENABLE_DUAL_WRITE:-true}
      BATCH_SIZE: ${CONSUMER_BATCH_SIZE:-10}
      HEALTH_PORT: 8091
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [finnet]

  book-consumer:
    build:
      context: ./consumers
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      cockroach-schema:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER:-kafka:9092}
      KAFKA_TOPIC: market.book_ticker.raw
      KAFKA_GROUP: book-cockroach-consumer
      COCKROACH_DSN: postgresql://root@cockroachdb-node1:26257/market?sslmode=disable
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/market
      ENABLE_DUAL_WRITE: ${ENABLE_DUAL_WRITE:-true}
      BATCH_SIZE: ${CONSUMER_BATCH_SIZE:-500}
      HEALTH_PORT: 8092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [finnet]

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.ignored-mount-points=^/(dev|proc|sys|var/lib/docker/.+|host/var/lib/docker/.+)($$|/)'
    ports:
      - "9100:9100"
    networks: [finnet]

volumes:
  cockroach-node1:
  cockroach-node2:
  cockroach-node3:
  postgres-data:
  grafana-data:

networks:
  finnet:
    name: finnet
